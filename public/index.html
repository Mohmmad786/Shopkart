<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopKart — Buy directly from trusted sellers</title>
  <meta name="description" content="Tijarat — browse products from verified sellers and contact them directly." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/icon.png" type="image/png" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#/home" class="brand">
        <span class="brand-mark">M</span>
        <span class="brand-name">ShopKart</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main id="app" class="container app-main" aria-live="polite">
    <div class="page-loader"><div class="spinner"></div></div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© 2025 Tijarat · Built with a secure role-based architecture</p>
    </div>
  </footer>

  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
